name: Release ZIP

# A release is published locally with `python scripts/publish.py release`,
# which creates the tag. This workflow builds the same commit again on GitHub:
# it compares its package file by file with the published one, or publishes it
# when the tag was pushed without a local release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # Old test tags such as v0.5.4-test.1 are not releases.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Validate module
        run: bash scripts/check-module.sh

      - name: Verify tag matches module version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk -F"'" '/\$this->version[[:space:]]*=/ {print $2; exit}' core/modules/modMahnwesen.class.php)"
          [[ "$GITHUB_REF_NAME" == "v${VERSION}" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match module version $VERSION" >&2
            exit 1
          }

      - name: Build, then publish or verify the release package
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py release --ci
