name: Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: bash scripts/check-module.sh

  dolibarr-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dolibarr: ['21.0', '22.0', '23.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check-dolibarr-api.sh ${{ matrix.dolibarr }}

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check-module.sh
      - run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mahnwesen-installable-${{ github.sha }}
          path: |
            dist/mahnwesen-*.zip
            dist/mahnwesen-*.zip.sha256
          if-no-files-found: error
