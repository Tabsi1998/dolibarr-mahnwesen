name: Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: bash scripts/check-module.sh

  dolibarr-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dolibarr: ['21.0', '22.0', '23.0', '24.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check-dolibarr-api.sh ${{ matrix.dolibarr }}

  runtime:
    # The same runtime checks as the local run: the module in running
    # Dolibarr 21 to 24 installations with MariaDB and Mailpit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/local_check.py --only runtime
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-logs-${{ github.sha }}
          path: |
            .local-testing/local-check.json
            .local-testing/logs/
          if-no-files-found: ignore

  build-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check-module.sh
      - run: bash scripts/build-release.sh
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: mahnwesen-installable-${{ github.sha }}
          path: |
            dist/mahnwesen-*.zip
            dist/mahnwesen-*.zip.sha256
          if-no-files-found: error

  publish-dev:
    # After a merge, once every check passed: the development package of main
    # in the pre-release "Entwicklungsstand (main)". If a local run published
    # it first, this build is compared with it file by file instead.
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: [php-lint, dolibarr-api, runtime, build-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py dev --ci
