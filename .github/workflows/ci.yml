name: Module CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: bash scripts/check-module.sh

  dolibarr-api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dolibarr: ['21.0', '22.0', '23.0', '24.0']
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bash scripts/check-dolibarr-api.sh ${{ matrix.dolibarr }}

  runtime:
    # The same runtime checks as the local run: the module in running
    # Dolibarr 21 to 24 installations with MariaDB and Mailpit.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/local_check.py --only runtime
      - if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-logs-${{ github.sha }}
          path: |
            .local-testing/local-check.json
            .local-testing/logs/
          if-no-files-found: ignore

  package:
    name: Package and release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Release metadata agrees
        run: python scripts/release.py --metadata
      - name: Build twice, byte for byte identical
        run: |
          python scripts/build_release.py --out dist-a
          python scripts/build_release.py --out dist-b
          cmp dist-a/module_mahnwesen-*.zip dist-b/module_mahnwesen-*.zip
          mkdir -p dist && cp dist-a/* dist/
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: module_mahnwesen-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
