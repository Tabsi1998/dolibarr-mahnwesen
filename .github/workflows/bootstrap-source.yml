name: Bootstrap repository source

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/workflow-ui-agenda'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap
          : > /tmp/mahnwesen-source.tar.gz
          for f in $(find .bootstrap -name 'source.part*.b64' | sort); do
            base64 -d "$f" >> /tmp/mahnwesen-source.tar.gz
          done
          echo "a990b14cb1bc94f132126f00bc81a22d0c84e74c91e10d7768632a78a8fe2d42  /tmp/mahnwesen-source.tar.gz" | sha256sum -c -

      - name: Replace branch with repository source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/mahnwesen-source.tar.gz -C .
          rm -rf .bootstrap
          chmod +x scripts/*.sh

      - name: Validate imported module
        shell: bash
        run: |
          ./scripts/check-module.sh
          ./scripts/build-release.sh
          unzip -t dist/mahnwesen-*.zip >/dev/null

      - name: Commit full source tree to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Mahnwesen 0.5.2 test source" || exit 0
          git push origin HEAD:${{ github.head_ref }}
